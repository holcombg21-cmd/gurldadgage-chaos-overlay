<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GurlDadGage Chaos Overlay</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .overlay-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px; /* change if you want it higher/lower */
      width: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .ticker-shell {
      width: 100%;
      padding: 10px 0;
      background: rgba(20, 6, 30, 0.78);
      border-top: 2px solid #b55cff;
      border-bottom: 2px solid #b55cff;
      box-shadow:
        0 0 18px rgba(181, 92, 255, 0.45),
        inset 0 0 16px rgba(181, 92, 255, 0.18);
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 28s linear infinite;
    }

    .ticker-group {
      display: inline-flex;
      align-items: center;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      margin-right: 38px;
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(181, 92, 255, 0.7);
    }

    .emoji {
      margin-right: 10px;
      font-size: 30px;
    }

    .divider {
      color: #c98cff;
      margin-right: 38px;
      font-size: 26px;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(201, 140, 255, 0.8);
    }

    @keyframes scroll-left {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="overlay-wrap">
    <div class="ticker-shell">
      <div class="ticker-track" id="tickerTrack">
        <div class="ticker-group" id="tickerGroupA"></div>
        <div class="ticker-group" id="tickerGroupB"></div>
      </div>
    </div>
  </div>

  <script>
    const items = [
      { emoji: "🍎", text: "JOIN THE GNG" },
      { emoji: "🐺", text: "HYDRATE PLS" },
      { emoji: "🫶", text: "MUCH LOVE" },
      { emoji: "🛠️", text: "G4R3DN TOOL" },
      { emoji: "🚀", text: "BLAST OFF" },
      { emoji: "💥", text: "CHAOS MODE" },
      { emoji: "🔫", text: "AMMO DROP" },
      { emoji: "🌙", text: "LOW GRAVITY" }
    ];

    function buildTicker(groupId) {
      const group = document.getElementById(groupId);

      items.forEach((item, index) => {
        const wrap = document.createElement("div");
        wrap.className = "ticker-item";
        wrap.innerHTML = `<span class="emoji">${item.emoji}</span><span>${item.text}</span>`;
        group.appendChild(wrap);

        const divider = document.createElement("div");
        divider.className = "divider";
        divider.textContent = "✦";
        group.appendChild(divider);
      });
    }

    buildTicker("tickerGroupA");
    buildTicker("tickerGroupB");
  </script>
</body>
</html>
