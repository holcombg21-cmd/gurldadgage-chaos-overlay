<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GurlDadGage | Chaos Lab Stream Overlay v2</title>
<style>
:root{--purple:#dba5ff;--white:#fff;--yellow:#ffe17b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}body{pointer-events:none;color:var(--white)}
#ticker{position:absolute;left:0;right:0;bottom:2.5%;height:118px;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 3%,#000 97%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 3%,#000 97%,transparent 100%)}
#track{display:flex;flex:none;align-items:center;width:max-content;animation:move var(--duration,72s) linear infinite;will-change:transform} .group{display:flex;flex:none;align-items:center;width:max-content}.gift{display:flex;align-items:center;gap:13px;white-space:nowrap;flex:none;padding:4px 34px 4px 8px;background:transparent}.gift img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 2px 4px #000)}.fallback{display:none;width:72px;height:72px;place-items:center;font-weight:900;font-size:27px;color:var(--purple);text-shadow:0 2px 5px black}.words{display:flex;flex-direction:column;gap:5px}.giftline{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:900;line-height:1.12;color:#fff;text-shadow:-2px -2px 3px #0a0511,2px -2px 3px #0a0511,-2px 2px 3px #0a0511,2px 2px 3px #0a0511,0 0 6px #000}.coins{font-size:17px;color:var(--yellow)}.effect{color:#ead0ff;font-weight:900;font-size:21px;line-height:1.1;text-shadow:-2px -2px 3px #090211,2px -2px 3px #090211,-2px 2px 3px #090211,2px 2px 3px #090211}.key{color:#fff;font-size:16px;margin-left:7px}.separator{color:#c88aff;font-size:25px;margin:0 6px;text-shadow:0 0 8px #000}@keyframes move{to{transform:translateX(-50%)}}
#counter{position:absolute;top:4%;right:3%;display:flex;align-items:center;gap:12px;padding:4px 6px;background:transparent;text-shadow:-3px -3px 3px #05030a,3px -3px 3px #05030a,-3px 3px 3px #05030a,3px 3px 3px #05030a,0 0 10px #000;font-weight:900}#skull{font-size:44px;filter:drop-shadow(0 2px 4px #000)}#deathLabel{font-size:25px;letter-spacing:2px;color:#e7bbff}#deathCount{font-size:52px;color:#fff;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
body.only-ticker #counter{display:none}body.only-counter #ticker{display:none}
@media(max-width:960px){#ticker{height:95px}.gift img{width:55px;height:55px}.giftline{font-size:19px}.coins{font-size:14px}.effect{font-size:17px}.key{font-size:13px}#deathCount{font-size:40px}#deathLabel{font-size:20px}}
</style></head><body>

const qp=new URLSearchParams(location.search),mode=qp.get('mode');if(mode==='ticker')document.body.classList.add('only-ticker');if(mode==='counter')document.body.classList.add('only-counter');
function giftNode(g){const wrap=document.createElement('div');wrap.className='gift';const img=document.createElement('img');img.alt=g.name+' gift';img.referrerPolicy='no-referrer';img.src=g.image;const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=g.name[0];img.onerror=()=>{img.style.display='none';fallback.style.display='grid'};const words=document.createElement('span');words.className='words';const name=document.createElement('span');name.className='giftline';name.append(document.createTextNode(g.name+' '));const coins=document.createElement('span');coins.className='coins';coins.textContent=g.coins;name.append(coins);const effect=document.createElement('span');effect.className='effect';effect.append(document.createTextNode(g.effect+' '));const key=document.createElement('span');key.className='key';key.textContent=g.key;effect.append(key);words.append(name,effect);wrap.append(img,fallback,words);return wrap}
function populate(el){GIFTS.forEach(g=>{el.append(giftNode(g));const sep=document.createElement('span');sep.className='separator';sep.textContent='✦';el.append(sep)})}
const first=document.getElementById('first');populate(first);populate(document.getElementById('second'));function updateSpeed(){document.getElementById('track').style.setProperty('--duration',Math.max(42,first.scrollWidth/115)+'s')}window.addEventListener('load',updateSpeed);window.addEventListener('resize',updateSpeed);updateSpeed();
async function refresh(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){const s=await r.json();document.getElementById('deathCount').textContent=Number(s.deaths)||0}}catch(e){/* Server unavailable; do not claim automatic counts. */}}refresh();setInterval(refresh,750);
</script></body></html>
